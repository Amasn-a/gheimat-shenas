// Team build: `./gradlew build` resolves from Maven Central (or the company mirror configured in Gradle settings).
// In supercoin these dependencies are replaced by the module's own Spring Boot ones; the game code has no framework imports.
// Offline machines without Maven Central can point at a local Maven-layout repository instead, for example the
// Debian/Ubuntu one installed by the lib*-java packages: ./gradlew build -PofflineRepo=/usr/share/maven-repo
plugins {
    id 'java'
    id 'application'
}

group = 'com.digikala.supercoin'
version = '0.1.0'

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }

def offlineRepo = findProperty('offlineRepo')

repositories {
    if (offlineRepo) maven { url = uri(offlineRepo) } else mavenCentral()
}

dependencies {
    implementation 'org.postgresql:postgresql:42.7.2'
    implementation 'com.zaxxer:HikariCP:2.7.9'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.14.0'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.14.1'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.14.0'
    runtimeOnly 'org.slf4j:slf4j-jdk14:1.7.32'
    implementation 'org.slf4j:slf4j-api:1.7.32'
    if (offlineRepo) {
        // the Debian/Ubuntu packaging pairs Jupiter 5.10 with Platform 1.9; its standalone jar is the consistent set
        testImplementation 'org.junit.platform:junit-platform-console-standalone:1.9.1'
    } else {
        testImplementation platform('org.junit:junit-bom:5.10.1')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
}

application {
    mainClass = 'com.digikala.supercoin.gamification.games.priceexpert.PriceExpertServer'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:unchecked', '-parameters']
}

test {
    useJUnitPlatform()
    testLogging { events 'failed'; exceptionFormat 'full'; showStandardStreams = false }
    systemProperty 'pe.test.db', System.getProperty('pe.test.db', 'jdbc:postgresql://127.0.0.1:5432/price_expert_test?user=pe&password=pe')
    maxParallelForks = 1
}
